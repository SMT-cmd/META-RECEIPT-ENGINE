<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171c3b"><meta name="description" content="Bizlano — your business, beautifully managed. Secure receipts, invoices, products, customers and team workspaces.">
<link rel="icon" href="/assets/bizlano-mark.png" type="image/png"><title>Bizlano Workspace — Your business, beautifully managed</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',system-ui,sans-serif;--ink:#172040;--muted:#7f8ba2;--line:#e6e9f1;--purple:#6933e6;--background:#f7f8fc;background:var(--background);color:var(--ink)}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ac87f7;outline-offset:2px}a{color:inherit}
h1,h2,h3{font-family:Manrope,system-ui,sans-serif;letter-spacing:-.6px}h1{font-size:clamp(23px,3vw,34px);margin:5px 0}h2{font-size:17px;margin:0 0 11px}h3{font-size:14px;margin:10px 0}.muted{color:var(--muted);line-height:1.65}.mini{font-size:11px}.eyebrow{font-size:10px;font-weight:800;color:#7d49d8;letter-spacing:1.6px}
.btn{border:1px solid #d9deea;border-radius:10px;min-height:42px;padding:10px 16px;background:#fff;color:#2b3656;font-weight:800;font-size:12px;display:inline-flex;justify-content:center;align-items:center;gap:7px;text-decoration:none}
.btn.primary{background:linear-gradient(115deg,#7737eb,#5023d6);color:#fff;border:0;box-shadow:0 3px 11px #5829d528}.btn.ghost{background:#f2efff;color:#6739d6;border-color:#e6e0ff}
button:hover:not(:disabled){filter:brightness(.975)}
#app{min-height:100vh}.auth-root{min-height:100dvh;display:grid;grid-template-columns:1fr minmax(320px,475px);background:#fff}
.auth-art{background:radial-gradient(circle at 70% 5%,#7532fa 0,#4827b9 27%,#141b42 70%);color:#fff;display:flex;flex-direction:column;padding:clamp(25px,6vw,80px);justify-content:space-between;position:relative;overflow:hidden}
.auth-art:after{content:'';position:absolute;inset:auto -10% -27% 20%;aspect-ratio:1;border:1px solid #fff2;border-radius:50%;box-shadow:0 0 0 70px #ffffff0a,0 0 0 140px #ffffff06;pointer-events:none}
.brand{display:flex;gap:11px;align-items:center;font-weight:850;font:800 25px Manrope;color:inherit;text-decoration:none;letter-spacing:-1px}.brand-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#ac7dff,#652af0,#3480ff);color:white;font:italic 900 28px Manrope;transform:skew(-5deg)}
.brand img.brand-icon{background:transparent;transform:none;object-fit:contain;padding:0;box-shadow:none;border-radius:0}
.auth-art .brand img.brand-icon{width:39px;height:39px;object-fit:contain;filter:drop-shadow(0 4px 9px rgba(0,0,0,.12))}
.auth-art{background:radial-gradient(ellipse at 0% 100%,#6040d0 0,transparent 44%),radial-gradient(ellipse at 90% 5%,#432c83 0,transparent 47%),linear-gradient(145deg,#151835,#272064)}
.auth-art .kicker{color:#d9cafd}
.auth-form-shell h2{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-1.2px}
.auth-form-shell .btn{border-radius:10px;min-height:47px}
.auth-form-shell .field input:focus{box-shadow:0 0 0 3px #7842dd18}
.auth-art h1{font-size:clamp(35px,4.8vw,65px);max-width:750px;line-height:1.1;letter-spacing:-2.2px}.auth-art p{line-height:1.8;color:#e1d9ff;max-width:480px;font-size:15px}.auth-art .kicker{font-size:11px;letter-spacing:2px;font-weight:800;color:#d8caff}
.auth-form-shell{padding:40px clamp(22px,4vw,55px);display:flex;justify-content:center;flex-direction:column}.auth-form-shell>div{width:100%;max-width:430px;margin:auto}.auth-form-shell h2{font-size:28px}.auth-form-shell p{font-size:13px}
.field{display:block;font-size:12px;font-weight:700;margin:13px 0;color:#4a5570}.field input,.field select,.field textarea,.control{display:block;width:100%;border:1px solid #dfe3ec;padding:11px 12px;border-radius:9px;min-width:0;margin-top:6px;background:#fff;color:#172040;outline-offset:2px}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#855de5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:10px}
.banner{background:#f3f0ff;border:1px solid #e0d8ff;border-radius:12px;padding:13px 15px;font-size:12px;line-height:1.6;margin:15px 0}
.error{background:#fff0f2!important;color:#a52036!important;border-color:#f3cad2!important}.hidden{display:none!important}
.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100dvh}
.sidebar{background:#151b35;color:#dde1f3;padding:26px 13px;display:flex;flex-direction:column;gap:10px;min-height:100dvh;position:sticky;top:0;max-height:100dvh;overflow-y:auto}
.sidebar .brand{padding:0 13px 28px;font-size:20px;border-bottom:1px solid #303955}.sidebar .brand-icon{height:38px;width:38px;font-size:25px}.sidebar .caption{font-size:10px;letter-spacing:2px;color:#7c89af;margin:16px 14px 2px}
.nav{display:grid;gap:3px}.nav button{border:0;text-align:left;background:transparent;color:#aeb8d3;padding:13px 14px;border-radius:10px;font-weight:650;font-size:13px}.nav button[data-active=true]{color:white;background:#303758;box-shadow:inset 3px 0 0 #9b79ff}.nav button:hover{background:#282f4e;color:white}
.sidebar-bottom{margin-top:auto;border-top:1px solid #303955;padding:20px 12px;font-size:11px;color:#a6b1cd}.sidebar-bottom strong{display:block;color:#fff}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:100dvh}.topbar{background:white;border-bottom:1px solid var(--line);min-height:72px;padding:13px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar strong{font-size:14px}.topbar small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.workspace-main{width:100%;max-width:1530px;flex:1;margin:0 auto;padding:34px clamp(14px,3vw,44px) 45px;min-width:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px;flex-wrap:wrap}.page-head p{font-size:12px;margin:5px 0;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;min-width:0;margin-bottom:15px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.metric{background:#fff;border:1px solid var(--line);padding:19px;border-radius:13px;min-width:0}
.metric span{font-size:11px;color:#71809a;display:block}.metric strong{font:800 clamp(16px,2vw,26px) Manrope;display:block;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric small{color:#929eb2;font-size:10px;display:block;margin-top:5px}.cols{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.rowcard{padding:13px 0;border-bottom:1px solid #eff1f5;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px}
.rowcard:last-child{border:0}.rowcard small{display:block;color:var(--muted);margin-top:5px}.rowcard strong{font-weight:800}.rowcard .end{text-align:right}
.table-scroll{overflow-x:auto;max-width:100%}table{width:100%;border-collapse:collapse;min-width:570px;text-align:left}td,th{padding:13px 9px;border-bottom:1px solid #eef0f4;font-size:12px}th{color:#7d8aa2;font-size:10px;letter-spacing:.5px;text-transform:uppercase}td .btn{font-size:11px;padding:8px;min-height:32px}.empty{padding:25px;text-align:center;color:#8b96a9;font-size:13px;line-height:1.6}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);gap:18px;align-items:start}.line-item{display:grid;grid-template-columns:minmax(0,1fr) 75px 100px 34px;align-items:end;gap:7px}.line-item .field{margin:6px 0}.line-item button{height:43px;border:0;background:#fff2f3;color:#ab263c;border-radius:9px}
.receipt-stage{position:sticky;top:17px;background:#eeeefa;border:1px solid #dfe4f0;border-radius:15px;padding:15px;min-width:0}
.receipt{background:white;padding:26px 23px;border-radius:7px;box-shadow:0 8px 24px #121b3e13;color:#27324c}
.receipt .r-head{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid #6c39e4;padding-bottom:18px}.receipt h2{font-size:20px;margin:0}.receipt h3{margin:0;font-size:17px}.receipt .r-small{font-size:10px;color:#8994a8;line-height:1.7}.receipt .r-section{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.receipt table{min-width:0}.receipt th,.receipt td{font-size:10px;padding:9px 2px}.receipt th:last-child,.receipt td:last-child{text-align:right}.receipt .r-total{margin:22px 0 0 auto;max-width:230px}.receipt .r-total div{display:flex;justify-content:space-between;font-size:11px;margin:10px 0}.receipt .r-total .grand{font-weight:900;font-size:15px;padding:10px 0;border-top:2px solid #eee}.receipt .powered{text-align:center;margin-top:30px;padding-top:10px;border-top:1px solid #e2e5ef;color:#79829b;font-size:10px}
.footer{padding:17px;color:#8b95a8;font-size:11px;text-align:center}.mobile-nav,.menu-toggle,.mobile-scrim{display:none}
.toast{position:fixed;right:20px;bottom:25px;background:#192147;color:#fff;padding:14px 19px;border-radius:10px;font-size:12px;z-index:100;max-width:min(370px,90vw);box-shadow:0 8px 30px #141a3450}
.pie{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:center}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(#703de9 0 67%,#39b4d2 67% 87%,#e5e8f5 87%);position:relative}.donut:after{content:'Sales';position:absolute;inset:35px;background:white;border-radius:50%;display:grid;place-items:center;color:#4d5472;font-weight:800}
.receipt-logo{height:49px;width:auto;max-width:140px;object-fit:contain;display:block;margin:0 0 9px}
.receipt.style-classic{font-family:Georgia,serif}.receipt.style-classic .r-head{border-color:#2f3d59}.receipt.style-classic .powered{font-family:system-ui,sans-serif}
.receipt.style-executive .r-head{border-color:#c9aa6b}.receipt.style-executive h2,.receipt.style-executive h3{color:#1b3154}
.receipt.style-retail .r-head{border-color:#168479}.receipt.style-retail .grand{background:#e9f8f5;padding:11px}
.receipt.style-thermal{max-width:80mm;margin:auto;padding:15px 10px;border-radius:0;box-shadow:0 1px 5px #0002;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}.receipt.style-thermal .r-head{border-color:#333;border-bottom-style:dashed}.receipt.style-thermal h2{font-size:15px}.receipt.style-thermal h3{font-size:12px}.receipt.style-thermal .r-section{margin:15px 0;gap:7px}.receipt.style-thermal table th,.receipt.style-thermal table td{font-size:9px}
.receipt.style-minimal .r-head{border-color:#dde2eb}.receipt.style-minimal .r-total .grand{border-color:#aeb9cb}
.receipt.style-editorial{font-family:Georgia,serif}.receipt.style-editorial .r-head{border-color:#ab538a}.receipt.style-editorial h2{font-style:italic}
.receipt.style-bold .r-head{background:#5725cf;color:#fff;padding:17px;margin:-26px -23px 20px;border:0}.receipt.style-bold .r-head .r-small{color:#eee8ff}
.receipt.style-artisan .r-head{border-color:#b65f4b}.receipt.style-artisan h2{color:#924433}
.receipt.style-medical .r-head{border-color:#22869d}.receipt.style-medical h2{color:#176b81}
.receipt.style-education .r-head{border-color:#6458bd}.receipt.style-education h2{color:#50469d}
.receipt.style-hospitality .r-head{border-color:#a87539}.receipt.style-hospitality h2{color:#795529}
@media print{.receipt.style-thermal{width:80mm;max-width:80mm!important}.receipt.style-bold .r-head{margin:-26px -23px 20px;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
@media(max-width:1100px){.cols,.editor{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.receipt-stage{position:static;max-width:700px}}
@media(max-width:760px){
.auth-root{grid-template-columns:1fr}.auth-art{min-height:200px;padding:24px;gap:16px}.auth-art h1{font-size:32px;letter-spacing:-1px}.auth-art p{display:none}.auth-art .kicker{font-size:9px}.auth-form-shell{min-height:60vh;padding:25px 22px 40px}
.shell{display:block}.sidebar{position:fixed;top:0;left:0;bottom:0;z-index:80;width:min(300px,85vw);transform:translateX(-105%);transition:transform .18s ease;box-shadow:9px 0 35px #0a102645}.sidebar.open{transform:translateX(0)}
.mobile-scrim{display:block;position:fixed;inset:0;background:#0e143a88;z-index:70;border:0}.workspace{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}.workspace-main{padding:19px 12px 29px}
.topbar{min-height:61px;padding:8px 12px}.topbar .btn{display:none}.menu-toggle{display:inline-flex;background:#f2f4fa;border:1px solid #e7e9f2;border-radius:9px;width:40px;height:40px;justify-content:center;align-items:center;font-size:21px}
.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:stretch;background:#fff;border-top:1px solid #e7e9f2;box-shadow:0 -4px 22px #0f1b3710;padding:5px 8px calc(5px + env(safe-area-inset-bottom,0px));min-height:calc(68px + env(safe-area-inset-bottom,0px))}
.mobile-nav button{min-width:0;flex:1;display:grid;align-content:center;justify-items:center;gap:3px;background:none;border:0;font-size:10px;color:#78849b;font-weight:800;border-radius:9px;min-height:53px}.mobile-nav button span{font-size:24px;line-height:1}.mobile-nav button.active{color:#6732d9}.mobile-nav button.create span{background:linear-gradient(135deg,#9b5cff,#5b29dc);color:#fff;min-width:43px;border-radius:10px;padding:1px}
.page-head{margin-bottom:16px}.page-head h1{font-size:23px}.panel{padding:15px}.metric{padding:13px}.metric strong{font-size:17px}.metric span{font-size:10px}
.form-grid{grid-template-columns:1fr}.line-item{grid-template-columns:minmax(0,1fr) 53px 77px 30px;gap:5px}.line-item .field input{padding:9px 7px;font-size:12px}.line-item .field{font-size:10px}.receipt{padding:21px 12px}
.pie{grid-template-columns:1fr}.donut{margin:0 auto}.toast{bottom:calc(85px + env(safe-area-inset-bottom,0px));left:10px;right:10px;max-width:none}
}
@media print{
@page{margin:12mm}
body,html{background:#fff!important}.sidebar,.topbar,.page-head,.editor-form,.mobile-nav,.footer,.panel,.toast,.receipt-stage>h2,.receipt-stage>.btn{display:none!important}
.shell,.workspace,.workspace-main,.editor,.receipt-stage{display:block!important;min-height:0!important;max-width:none!important;margin:0!important;padding:0!important;border:0!important;background:white!important}
.receipt{max-width:none!important;box-shadow:none!important;padding:0!important;border-radius:0!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.receipt table{display:table!important}.receipt tr{break-inside:avoid}.receipt .powered{display:block!important}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body><div id="app"><div class="empty">Loading Bizlano securely…</div></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><script type="module" src="/client.js"></script></body>
</html>
