/* DISTINCT PRINTABLE DOCUMENT SYSTEM — all previews and printed receipts use these same rules. */
.receipt{position:relative;overflow:hidden;isolation:isolate;--r-tone:color-mix(in srgb,var(--receipt-accent) 9%,white);--r-soft:color-mix(in srgb,var(--receipt-accent) 17%,white);--r-dark:color-mix(in srgb,var(--receipt-accent) 78%,#111a2d);line-height:1.52}
.receipt .r-design-strip{display:flex;height:9px;gap:0;margin:-26px -23px 24px;background:var(--receipt-accent)}

.receipt .r-design-strip i:nth-child(2){background:color-mix(in srgb,var(--receipt-accent) 64%,white)}
.receipt .r-design-strip i:nth-child(3){background:color-mix(in srgb,var(--receipt-accent) 38%,white)}
.receipt .r-brand-identity{display:flex;align-items:center;gap:13px;min-width:0}
.receipt .r-brand-name{min-width:0}
.receipt .r-brand h2{overflow-wrap:anywhere;line-height:1.14;letter-spacing:-.6px;font-size:21px}
.receipt .r-head{gap:16px;align-items:flex-start;display:flex;justify-content:space-between;padding-bottom:18px;margin-bottom:4px;border-bottom:2px solid var(--receipt-accent)}
.receipt .r-overline{display:block;font:800 8px/1.2 system-ui,sans-serif;letter-spacing:2.2px;margin-bottom:8px;color:var(--receipt-accent)}
.receipt .r-initials{flex:none;display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--receipt-accent);background:var(--r-tone);color:var(--receipt-accent);border-radius:10px;font:900 16px/1 system-ui,sans-serif;letter-spacing:-.5px}
.receipt .r-document-identity{min-width:98px;max-width:50%;text-align:right}
.receipt .r-doc-kicker{display:block;margin-bottom:7px;font:800 8px/1.2 system-ui,sans-serif;letter-spacing:1.9px;color:var(--receipt-accent)}
.receipt .r-document-identity h3{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.receipt .r-document-number{margin-top:5px;overflow-wrap:anywhere}
.receipt .r-section{align-items:start;margin:18px 0 22px}
.receipt .r-section strong{font:800 9px/1.4 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:5px}
.receipt .r-table-wrap{min-width:0}
.receipt .r-table-wrap table{width:100%;table-layout:fixed}
.receipt .r-table-wrap table th:first-child,.receipt .r-table-wrap table td:first-child{width:60%;text-align:left}
.receipt .r-table-wrap table th:nth-child(2),.receipt .r-table-wrap table td:nth-child(2){width:14%;text-align:center}
.receipt .r-table-wrap table th:last-child,.receipt .r-table-wrap table td:last-child{width:26%;text-align:right}
.receipt .r-table-wrap th{font-weight:850;letter-spacing:.55px}
.receipt .r-total{width:min(100%,270px);margin-left:auto;padding-top:6px}
.receipt .r-total .grand{color:var(--receipt-accent);border-top:2px solid var(--receipt-accent);margin:12px 0;padding:11px 6px;font-size:16px}
.receipt .r-total .grand span:last-child{font-weight:900;font-variant-numeric:tabular-nums}
.receipt .r-notes{margin-top:26px;border-top:1px solid #e8eaf2;padding-top:13px}
.receipt .powered{margin-top:26px;border-top:1px solid #e8eaf2;padding-top:11px;color:#737e94;font-size:9px}
.receipt .powered strong{color:var(--receipt-accent)!important}

/* Stronger thumbnails: show meaningful proportions of the *same* document. */
.design-card.real-template{gap:8px;box-shadow:0 3px 15px #2732550b}
.design-card.real-template.selected{border:2px solid #6940d1;box-shadow:0 0 0 3px #6b44d91a}
.design-card.real-template .template-thumbnail{height:205px;background:linear-gradient(145deg,#eaedf3,#f7f8fb)}
.template-thumbnail-inner{top:8px}
.design-card-story{display:flex;gap:7px;align-items:flex-start;color:#647087;font-size:10px;line-height:1.35;min-height:30px}
.design-card-color{width:12px;height:12px;min-width:12px;border-radius:4px;border:1px solid #ffffff70;box-shadow:0 1px 4px #131c2e1d}
.colour-story-title{display:flex;flex-direction:column;gap:5px;margin:20px 0 11px}
.colour-story-title strong{font-size:13px;color:#283550}
.colour-story-title small{font-size:11px;color:#738099}
.studio-colour-panel{margin-top:18px;border-top:1px solid #e8eaf2;padding-top:13px}
.colour-story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.colour-story{display:grid;grid-template-columns:23px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 7px;align-items:center;border:1px solid #dfe4ee;background:#fff;border-radius:10px;padding:10px;text-align:left;min-height:61px}
.colour-story:hover{border-color:#9a80d2;background:#f8f5ff}
.colour-story.active{border-color:#6b40cf;background:#f4eeff;box-shadow:0 0 0 2px #6b40cf1f}
.colour-story-dot{display:block;grid-row:1/3;width:23px;height:23px;border-radius:7px;border:1px solid #ffffff77}

@media(max-width:760px){
 .studio-choice-layout .design-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .design-card.real-template .template-thumbnail{height:180px}
 .template-thumbnail-inner{transform:scale(.23)}
 .colour-story-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .colour-story{padding:8px;min-height:58px}
 .colour-story-name{font-size:11px}
 .colour-story-meaning{font-size:9px}
}

 .receipt{overflow:visible;box-shadow:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .receipt .r-design-strip,.receipt .r-head,.receipt .grand,.receipt .r-table-wrap th{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}


/* Recovered original August 2026 template styles */

        
        /* ===== TEMPLATE 1: MODERN TECH ===== */
        .legacy-receipt.tpl-modern-tech { font-family: 'Rajdhani', sans-serif; }
        .legacy-receipt.tpl-modern-tech .receipt-header { background: var(--tpl-secondary, #1A1A1A); color: white; }
        .legacy-receipt.tpl-modern-tech .header-accent { position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .brand-name span { color: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .brand-contact strong { color: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .doc-type-badge { background: var(--tpl-primary, #FF6B00); color: white; transform: rotate(-3deg); box-shadow: 0 10px 30px rgba(255,107,0,0.4); }
        .legacy-receipt.tpl-modern-tech .info-section { background: #f5f5f5; border-bottom: 3px solid var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .section-line { background: linear-gradient(to right, var(--tpl-primary, #FF6B00), transparent); }
        .legacy-receipt.tpl-modern-tech .items-table th { background: var(--tpl-secondary, #1A1A1A); color: white; }
        .legacy-receipt.tpl-modern-tech .words-box { background: rgba(255,107,0,0.05); border-left: 4px solid var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .totals-box { background: #f5f5f5; border: 2px solid var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .total-row:last-child { border-color: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .total-value.grand { color: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .signature-box { border-color: var(--tpl-secondary, #1A1A1A); }
        .legacy-receipt.tpl-modern-tech .stamp-outer { border: 3px solid var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .stamp-inner { border-color: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .stamp-status { color: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .stamp-divider { background: linear-gradient(to right, transparent, var(--tpl-primary, #FF6B00), transparent); }
        .legacy-receipt.tpl-modern-tech .footer-message { background: #f5f5f5; border-top: 3px solid var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .message-text { color: var(--tpl-primary, #FF6B00); }
        .legacy-receipt.tpl-modern-tech .receipt-footer { background: var(--tpl-secondary, #1A1A1A); color: white; }
        .legacy-receipt.tpl-modern-tech .footer-brand span { color: var(--tpl-primary, #FF6B00); }

<script>
/* Independent recovery UI. A broken, cached or blocked main bundle must never hold the spinner forever. */
(function(){
 const startup=document.getElementById('bizlano-startup'),root=document.getElementById('app');
 if(!startup||!root)return;
 const q=new URL(location.href).searchParams;
 let mode=q.has('reset')?'reset':q.get('mode')==='register'?'register':'login';
 let busy=false;
 const p=document.createElement('div');p.className='bizlano-recovery-ui';
 function linkMode(next){mode=next;draw()}
 function field(label,name,type,attr){
  const wrap=document.createElement('label');wrap.className='bizlano-recovery-field';
  const title=document.createElement('span');title.textContent=label;
  const input=document.createElement('input');input.name=name;input.type=type;input.required=true;input.autocomplete=attr||'off';
  if(name==='password')input.minLength=mode==='login'?6:10;
  wrap.append(title,input);return wrap;
 }
 function note(message,isError){const n=document.getElementById('bizlano-recovery-message');if(n){n.textContent=message;n.style.color=isError?'#a72748':'#31466e'}}
 async function send(path,payload){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),14000);
  try{const r=await fetch('/api'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),credentials:'same-origin',cache:'no-store',signal:controller.signal});
   const body=await r.json().catch(()=>({error:'Unexpected server response'}));
   if(!r.ok)throw new Error(body.error||'Request failed. Please try again.');return body;
  }finally{clearTimeout(timer)}
 }
 function draw(){
  if(!root.contains(p))return;
  p.replaceChildren();
  const image=document.createElement('img');image.src='/assets/bizlano-mark.png';image.alt='';image.width=64;image.height=64;
  const heading=document.createElement('h1');heading.textContent=mode==='register'?'Register for free':mode==='forgot'?'Reset password':mode==='reset'?'Set a new password':'Sign in to Bizlano';
  const desc=document.createElement('p');desc.textContent=mode==='register'?'Create your business workspace.':mode==='forgot'?'Enter your email to receive a reset link.':mode==='reset'?'Choose a new password.':'Your business, beautifully managed.';
  const form=document.createElement('form');form.className='bizlano-recovery-form';
  if(mode==='register')form.append(field('Full name','name','text','name'));
  if(mode!=='reset')form.append(field('Email address','email','email','email'));
  if(mode==='register'||mode==='login'||mode==='reset')form.append(field(mode==='reset'?'New password':'Password','password','password',mode==='login'?'current-password':'new-password'));
  const submit=document.createElement('button');submit.type='submit';submit.textContent=mode==='register'?'Register':mode==='forgot'?'Send reset link':mode==='reset'?'Update password':'Sign in';form.append(submit);
  const status=document.createElement('p');status.id='bizlano-recovery-message';status.setAttribute('role','status');
  const actions=document.createElement('div');actions.className='bizlano-recovery-actions';
  for(const [title,next] of [['Register','register'],['Sign in','login'],['Forgot password?','forgot']]){
   if(next===mode||mode==='reset')continue;const b=document.createElement('button');b.type='button';b.textContent=title;b.addEventListener('click',()=>linkMode(next));actions.append(b);
  }
  form.addEventListener('submit',async event=>{
   event.preventDefault();if(busy)return;busy=true;submit.disabled=true;
   const data=Object.fromEntries(new FormData(form).entries());
   note('Connecting…',false);
   try{
    if(mode==='register'){await send('/account/register',data);form.replaceWith(document.createTextNode('Check your email for your verification link. You can then sign in.'));note('Verification link sent.',false)}
    else if(mode==='forgot'){await send('/account/reset-request',{email:data.email});note('If this account exists, a secure link will arrive in your inbox.',false)}
    else if(mode==='reset'){await send('/account/reset',{token:q.get('reset'),password:data.password});location.replace('/app?auth=ready')}
    else {const r=await send('/account/login',{email:data.email,password:data.password});if(r.user){location.replace('/app?auth=ready')}else note('Sign-in was not completed.',true)}
   }catch(error){note(error.name==='AbortError'?'Connection timed out. Try again.':error.message||'Please try again.',true)}
   finally{busy=false;submit.disabled=false}
  });
  p.append(image,heading,desc,form,status,actions);
 }
 const style=document.createElement('style');style.textContent='.bizlano-recovery-ui{width:min(100%,420px);margin:7vh auto;padding:28px;border:1px solid #ece7fa;border-radius:22px;background:#fff;box-shadow:0 20px 70px #2e1d6730;color:#222743;font:15px system-ui,sans-serif}.bizlano-recovery-ui img{border-radius:15px}.bizlano-recovery-ui h1{font:800 26px system-ui;margin:16px 0 9px}.bizlano-recovery-ui p{line-height:1.6;color:#606b80}.bizlano-recovery-form{display:grid;gap:15px;margin-top:22px}.bizlano-recovery-field{display:grid;gap:6px;font-weight:650;font-size:13px}.bizlano-recovery-field input{border:1px solid #cdd2df;border-radius:10px;padding:12px;font:16px system-ui;min-height:46px}.bizlano-recovery-form button{border:0;background:#6933e6;color:white;border-radius:10px;min-height:46px;font-weight:800}.bizlano-recovery-form button:disabled{opacity:.6}.bizlano-recovery-actions{display:flex;flex-wrap:wrap;gap:8px}.bizlano-recovery-actions button{background:white;border:1px solid #dde0ea;border-radius:9px;padding:9px 12px;color:#463582;font-weight:650}';
 document.head.append(style);
 // Only activate if the full workspace did not replace the temporary loading screen.
 setTimeout(()=>{if(!document.getElementById('bizlano-startup'))return;
  root.replaceChildren(p);document.title='Bizlano — Sign in or Register';draw();
 },5500);
})();
</script>
